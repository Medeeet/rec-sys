experiment_name: optuna_hybrid_tuning
n_trials: 50
timeout: 86400

search_space:
  learning_rate:
    type: log_float
    low: 0.0001
    high: 0.01
  embed_dim:
    type: categorical
    choices: [32, 64, 128]
  gru_hidden_dim:
    type: categorical
    choices: [64, 128, 256]
  gru_num_layers:
    type: int
    low: 1
    high: 3
  dropout:
    type: float
    low: 0.0
    high: 0.5
  batch_size:
    type: categorical
    choices: [512, 1024, 2048]

pruner:
  type: median
  n_warmup_steps: 5

training_override:
  epochs: 20
  early_stopping_patience: 3
